name: Build and Create Release
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    container: node:current-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install VSCE
        run: npm install -g vsce

      - name: Build Package
        run: vsce package

      - name: Create release
        uses: akkuman/gitea-release-action@v1
        with:
          files: |-
            *.vsix
